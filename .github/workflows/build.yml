name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bump versionCode to run number
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeypadSender-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          APK="${REPO_NAME}-v${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          gh release create "v${{ github.run_number }}" "$APK"             --title "${REPO_NAME} v${{ github.run_number }}"             --notes "${REPO_NAME} build ${{ github.run_number }} (commit ${GITHUB_SHA::7})"             --target "$GITHUB_SHA"
