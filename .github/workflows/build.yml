name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set version (versionCode = run number, versionName = 1.N)
        # גרסה 1.0 = ריצה 24 (האחרונה לפני המעבר לגרסאות). כל ריצה חדשה מעלה את N ב-1: 1.1, 1.2, ...
        run: |
          MINOR=$(( ${{ github.run_number }} - 24 ))
          VERSION="1.${MINOR}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeypadSender-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          APK="${REPO_NAME}-v${VERSION}.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          gh release create "v${VERSION}" "$APK"             --title "${REPO_NAME} v${VERSION}"             --notes "${REPO_NAME} version ${VERSION} (build ${{ github.run_number }}, commit ${GITHUB_SHA::7})"             --target "$GITHUB_SHA"
