image: gradle:8.9-jdk17

variables:
  ANDROID_SDK_TOOLS: "11076708"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

stages:
  - build

cache:
  key: gradle
  paths:
    - .gradle-home/caches/
    - android-sdk/

before_script:
  - apt-get update -qq && apt-get install -y -qq wget unzip
  - export ANDROID_HOME=$PWD/android-sdk
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
      unzip -q commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip -d android-sdk-tmp
      mkdir -p $ANDROID_HOME/cmdline-tools
      mv android-sdk-tmp/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    fi
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

build_apk:
  stage: build
  script:
    - sed -i "s/versionCode [0-9]*/versionCode ${CI_PIPELINE_IID}/" app/build.gradle
    - gradle testDebugUnitTest --no-daemon
    - gradle assembleDebug --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 30 days
